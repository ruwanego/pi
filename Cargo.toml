[workspace]
resolver = "3"
members = ["crates/pi-native", "crates/pi-protocol"]

[workspace.package]
version = "0.99.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/earendil-works/pi"
rust-version = "1.85"

[workspace.dependencies]
napi = { version = "=3.14.0", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.10"
napi-build = "=2.6.0"
pi-protocol = { path = "crates/pi-protocol" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
